services:
  - type: web
    name: authorium-shop-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        value: /tmp/authorium.db?_journal_mode=WAL&_busy_timeout=5000&_foreign_keys=on
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        value: https://authorium-shop-app.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://authorium-shop-app.onrender.com,https://authorium-shop-admin.onrender.com

  - type: web
    name: authorium-shop-app
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://authorium-shop-api.onrender.com/api/v1
      - key: API_INTERNAL_URL
        value: https://authorium-shop-api.onrender.com/api/v1

  - type: web
    name: authorium-shop-site
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./landing/Dockerfile
    dockerContext: ./landing
    envVars:
      - key: PORT
        value: "3001"

  - type: web
    name: authorium-shop-admin
    runtime: static
    rootDir: admin
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://authorium-shop-api.onrender.com/api/v1