<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="100%" style="stop-color:#1b2d44"/>
    </linearGradient>
  </defs>
  <rect width="200" height="300" fill="url(#bg)"/>
  <!-- candle -->
  <rect x="95" y="130" width="10" height="50" fill="#f5e6c8"/>
  <ellipse cx="100" cy="125" rx="5" ry="7" fill="#ffcc00"/>
  <ellipse cx="100" cy="122" rx="3" ry="4" fill="#ff8800"/>
  <ellipse cx="100" cy="120" rx="1.5" ry="2" fill="#ffffff"/>
  <!-- light glow -->
  <circle cx="100" cy="125" r="40" fill="#ffaa00" opacity="0.07"/>
  <circle cx="100" cy="125" r="20" fill="#ffaa00" opacity="0.1"/>
  <!-- line divider -->
  <rect x="40" y="190" width="120" height="1" fill="#334466" opacity="0.6"/>
  <text x="100" y="220" font-family="Georgia,serif" font-size="11" fill="#a0b4cc" text-anchor="middle">ԻՎԱՆ ԻԼՅԻՉԻ</text>
  <text x="100" y="238" font-family="Georgia,serif" font-size="14" fill="#c8d8e8" text-anchor="middle" font-weight="bold">ՄԱՀԸ</text>
  <text x="100" y="256" font-family="Georgia,serif" font-size="8" fill="#6688aa" text-anchor="middle">Լև Տոլստոյ</text>
</svg>
