<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001a10"/>
      <stop offset="100%" style="stop-color:#003320"/>
    </linearGradient>
  </defs>
  <rect width="200" height="300" fill="url(#bg)"/>
  <!-- beetle/insect shape -->
  <ellipse cx="100" cy="140" rx="35" ry="25" fill="#1a5c30"/>
  <ellipse cx="100" cy="138" rx="28" ry="18" fill="#226633"/>
  <!-- antenna -->
  <line x1="85" y1="118" x2="70" y2="95" stroke="#44aa66" stroke-width="1.5"/>
  <line x1="115" y1="118" x2="130" y2="95" stroke="#44aa66" stroke-width="1.5"/>
  <circle cx="70" cy="95" r="3" fill="#66cc88"/>
  <circle cx="130" cy="95" r="3" fill="#66cc88"/>
  <!-- legs -->
  <line x1="75" y1="145" x2="50" y2="160" stroke="#338844" stroke-width="1.5"/>
  <line x1="75" y1="150" x2="45" y2="168" stroke="#338844" stroke-width="1.5"/>
  <line x1="125" y1="145" x2="150" y2="160" stroke="#338844" stroke-width="1.5"/>
  <line x1="125" y1="150" x2="155" y2="168" stroke="#338844" stroke-width="1.5"/>
  <!-- eyes -->
  <circle cx="90" cy="135" r="4" fill="#001a10"/>
  <circle cx="110" cy="135" r="4" fill="#001a10"/>
  <text x="100" y="210" font-family="Georgia,serif" font-size="7" fill="#66cc88" text-anchor="middle">ԿԵՐՊԱՐԱՆԱՓՈԽՈՒԹՅՈՒՆ</text>
  <text x="100" y="232" font-family="Georgia,serif" font-size="10" fill="#88dd99" text-anchor="middle" font-weight="bold">ԿԵՐՊԱՐԱՆԱՓՈԽՈՒԹՅՈՒՆ</text>
  <text x="100" y="250" font-family="Georgia,serif" font-size="8" fill="#446655" text-anchor="middle">Franz Kafka</text>
</svg>
